name: Boletim Orion Diário

on:
  workflow_dispatch:
  # Gatilho externo (ex.: cron da VPS via API) — preciso ao minuto, contorna o
  # atraso do agendador do GitHub. Dispare com event_type "boletim-orion".
  repository_dispatch:
    types: [boletim-orion]
  schedule:
    # Rede de segurança. 07:30 BRT = 10:30 UTC. O agendador do GitHub é
    # best-effort e pode atrasar horas; prefira o repository_dispatch da VPS.
    - cron: '30 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar boletim HTML
        run: python boletim_orion/render_boletim.py

      - name: Criar página inicial
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=boletim-orion-latest.html">
            <title>Boletim Orion</title>
          </head>
          <body>
            <p>Redirecionando para o <a href="boletim-orion-latest.html">Boletim Orion mais recente</a>.</p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Enviar link no Telegram quando secrets existirem
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID não configurados; pulando envio."
            exit 0
          fi
          # Aguarda até 08:00 BRT (11:00 UTC) quando o processamento terminar antes.
          TARGET_TS="$(date -u -d "$(date -u +%Y-%m-%d) 11:00:00 UTC" +%s)"
          NOW_TS="$(date -u +%s)"
          if [ "${NOW_TS}" -lt "${TARGET_TS}" ]; then
            SLEEP_SECONDS=$((TARGET_TS - NOW_TS))
            echo "Boletim pronto. Aguardando ${SLEEP_SECONDS}s para enviar às 08:00 BRT."
            sleep "${SLEEP_SECONDS}"
          fi
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          URL="https://${OWNER_LC}.github.io/${NAME}/boletim-orion-latest.html"
          if [ -f dist/telegram-summary.txt ]; then
            TEXT="$(cat dist/telegram-summary.txt)"
          else
            TEXT=$'📊 Boletim Orion — Abertura de Mercado\n\nLink do boletim:\n'"${URL}"
          fi
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=false"
