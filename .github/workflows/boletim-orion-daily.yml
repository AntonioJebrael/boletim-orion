name: Boletim Orion Diário

on:
  workflow_dispatch:
  # Gatilho externo (ex.: cron da VPS via API) — preciso ao minuto, contorna o
  # atraso do agendador do GitHub. Dispare com event_type "boletim-orion".
  repository_dispatch:
    types: [boletim-orion]
  schedule:
    # Rede de segurança. 07:30 BRT = 10:30 UTC. O agendador do GitHub é
    # best-effort e pode atrasar horas; o job "gate" descarta execuções que
    # caírem fora da janela de publicação (ver abaixo).
    - cron: '30 10 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Janela de publicação: só gera/publica/envia entre 07:00 e 09:30 (BRT) e uma
  # única vez por dia. Evita boletim de abertura chegando à tarde (atraso do
  # agendador do GitHub) e mensagem duplicada quando VPS e schedule disparam.
  # Execução manual (workflow_dispatch) ignora a janela e a deduplicação.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Verificar janela de horário e execução única no dia
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JANELA_INICIO: '0700'
          JANELA_FIM: '0930'
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Execução manual: sem restrição de horário."
            echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGORA="$(TZ=America/Sao_Paulo date +%H%M)"
          if [ $((10#${AGORA})) -lt $((10#${JANELA_INICIO})) ] || [ $((10#${AGORA})) -gt $((10#${JANELA_FIM})) ]; then
            echo "Fora da janela ${JANELA_INICIO}-${JANELA_FIM} BRT (agora ${AGORA}); nada será publicado nem enviado."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # HOJE em BRT; 10:00Z = 07:00 BRT (início da janela). Só contam
          # execuções criadas dentro da janela, para que uma descartada antes
          # das 07:00 não bloqueie a do dia.
          HOJE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          OUTRAS="$(gh api -X GET "repos/${REPO}/actions/workflows/boletim-orion-daily.yml/runs" \
            -f created=">=${HOJE}" -f per_page=50 \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID}) | select(.created_at >= \"${HOJE}T10:00:00Z\") | select(.event != \"workflow_dispatch\") | select(.status != \"completed\" or .conclusion == \"success\")] | length" || echo 0)"
          if [ "${OUTRAS:-0}" -gt 0 ]; then
            echo "Já existe execução hoje (${HOJE}) em andamento ou concluída; evitando envio duplicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Dentro da janela (${AGORA} BRT) e primeira execução do dia."
          echo "ok=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar utilitarios de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Coletar fluxo estrangeiro B3
        run: python boletim_orion/collect_b3_foreign_flow.py

      - name: Gerar boletim HTML
        run: python boletim_orion/render_boletim.py

      - name: Criar página inicial
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=boletim-orion-latest.html">
            <title>Boletim Orion</title>
          </head>
          <body>
            <p>Redirecionando para o <a href="boletim-orion-latest.html">Boletim Orion mais recente</a>.</p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Enviar link no Telegram quando secrets existirem
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Secrets TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID não configurados; pulando envio."
            exit 0
          fi
          # Aguarda até 08:00 BRT (11:00 UTC) quando o processamento terminar antes.
          TARGET_TS="$(date -u -d "$(date -u +%Y-%m-%d) 11:00:00 UTC" +%s)"
          NOW_TS="$(date -u +%s)"
          if [ "${NOW_TS}" -lt "${TARGET_TS}" ]; then
            SLEEP_SECONDS=$((TARGET_TS - NOW_TS))
            echo "Boletim pronto. Aguardando ${SLEEP_SECONDS}s para enviar às 08:00 BRT."
            sleep "${SLEEP_SECONDS}"
          fi
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          URL="https://${OWNER_LC}.github.io/${NAME}/boletim-orion-latest.html"
          if [ -f dist/telegram-summary.txt ]; then
            TEXT="$(cat dist/telegram-summary.txt)"
          else
            TEXT=$'📊 Boletim Orion — Abertura de Mercado\n\nLink do boletim:\n'"${URL}"
          fi
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=false"
